<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>404 Not Found</title>
  <link rel="stylesheet" href="css/index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap">
</head>

<body>
  <div id="container">
    <h1 id="zero">404</h1>
    <p>Page Not Found</p>
    <p id="errorCode">Error_Code yunyun</p>
  </div>
  <div id="passwordToggle">
    <input type="password" id="passwordInput" placeholder="Enter password">
    <button id="submitPassword">Enter</button>
    <div id="errorMsg">Fail</div>
  </div>
  <div id="cutScene">
    <div class="cutWrapper">
      <img id="yunyun" src="assets/yunyun.png" alt="">
    </div>
  </div>
  <video id="video-bg" src="assets/yunyun.mp4" muted loop playsinline preload="none"></video>
  <img src="assets/discord.png" id="discord" alt="discord">
  <div id="consoleOverlay">
    <div id="consoleWrap">
      <div id="consoleChara">
        <img id="charaImg" src="assets/chara.gif" alt="">
        <div id="charaSpeech">
          <span id="charaSpeechName">융융</span>
          <span id="charaSpeechText"></span>
        </div>
      </div>
      <div id="consoleInputRow">
        <span id="consolePrompt">&gt;</span>
        <input id="consoleInput" type="text" placeholder="명령어를 입력하세융!" autocomplete="off" spellcheck="false">
      </div>
    </div>
  </div>
  <div id="wallBreak" style="display:none">
    <div id="wallCharaWrap">
      <div id="wallSpeech">
        <span id="wallSpeechName">융융</span>
        <span id="wallSpeechText"></span>
      </div>
      <img id="wallChara" src="assets/help.gif" alt="">
    </div>
    <div id="wallPanel">
      <div id="wallTitle">// COMMAND LIST</div>
      <div id="wallList"></div>
    </div>
  </div>
  <div id="chatBox">
    <div id="chatResizeE"></div>
    <div id="chatResizeN"></div>
    <div id="chatHeader">
      <div id="chatHeaderLeft">
        <span id="chatTitle">// LIVE CHAT</span>
        <span id="chatUserCount">0</span>
      </div>
      <div id="chatHeaderRight">
        <span id="chatToggleList">명단</span>
        <span id="chatClose">✕</span>
      </div>
    </div>
    <div id="chatUserList"></div>
    <div id="chatMessages"></div>
    <div id="chatColorBar">
      <div id="chatColorPreview">미리보기</div>
      <div class="color-slider-row">
        <span class="color-slider-label">R</span>
        <input type="range" class="color-slider" id="sliderR" min="0" max="255" value="176">
        <input type="text" class="color-slider-val" id="valR" value="176" maxlength="3">
      </div>
      <div class="color-slider-row">
        <span class="color-slider-label">G</span>
        <input type="range" class="color-slider" id="sliderG" min="0" max="255" value="127">
        <input type="text" class="color-slider-val" id="valG" value="127" maxlength="3">
      </div>
      <div class="color-slider-row">
        <span class="color-slider-label">B</span>
        <input type="range" class="color-slider" id="sliderB" min="0" max="255" value="255">
        <input type="text" class="color-slider-val" id="valB" value="255" maxlength="3">
      </div>
    </div>
    <div id="chatImagePreview">
      <img id="chatImagePreviewImg" src="" alt="">
      <span id="chatImagePreviewName"></span>
      <span id="chatImageClear">✕</span>
    </div>
    <div id="chatInputRow">
      <div id="chatInputMain">
        <input id="chatNameInput" type="text" placeholder="이름" maxlength="10" autocomplete="off" spellcheck="false">
        <input id="chatTextInput" type="text" placeholder="메시지를 입력하세융!" maxlength="80" autocomplete="off"
          spellcheck="false">
      </div>
      <div id="chatInputActions">
        <button id="chatActColorBtn">이름 색상</button>
        <input type="file" id="chatImageFile" accept="image/*" style="display:none">
        <button id="chatActImgBtn">이미지 첨부</button>
        <button id="chatActSendBtn">메세지 전송</button>
      </div>
    </div>
  </div>

  <div id="cloudOverlay">
    <div id="cloudWrap">
      <div id="cloudHeader">
        <span id="cloudTitle">// CLOUD</span>
        <span id="cloudClose">✕</span>
      </div>
      <div id="cloudStatus">불러오는 중...</div>
      <div id="cloudList"></div>
      <div id="cloudEmpty">파일이 없어융...</div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <script src="js/panel-manager.js"></script>
  <script src="js/index.js"></script>
  <script src="js/omok.js"></script>
  <script src="js/commands.js"></script>
</body>

</html>
