<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>404 Not Found</title>
  <link rel="stylesheet" href="css/index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap">
</head>
<body>
  <div id="container">
    <h1 id="zero">404</h1>
    <p>Page Not Found</p>
    <p id="errorCode">Error_Code yunyun</p>

  <div id="passwordToggle">
    <input type="password" id="passwordInput" placeholder="Enter password">

  </div>
  <div id="cutScene">
    <div class="cutWrapper">
      <img id="yunyun" src="assets/yunyun.png" alt="">

  </div>
  <video id="video-bg" src="assets/yunyun.mp4" muted loop playsinline preload="none"></video>
  <button id="muteBtn">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
      <path d="M9 3v12.26A4 4 0 1 0 11 19V8h6V3z"/>
    </svg>
  </button>
  <img src="assets/discord.png" id="discord" alt="discord">
  <script src="js/index.js"></script>

</html>
